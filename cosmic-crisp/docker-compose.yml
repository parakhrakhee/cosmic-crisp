services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: cosmic_crisp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosmic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cosmic_crisp}
    ports:
      - "5432:5432"
    volumes:
      - cosmic_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosmic} -d ${POSTGRES_DB:-cosmic_crisp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cosmic_crisp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cosmic_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cosmic_pgdata:
  cosmic_redis:
